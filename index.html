<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16324f">
  <meta name="description" content="五人團隊共用休假月曆與登記系統">
  <title>員工休假月曆</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">TEAM LEAVE CALENDAR</p>
        <h1>員工休假月曆</h1>
      </div>
      <button class="primary compact" id="openLeaveForm" type="button">＋ 登記休假</button>
    </header>

    <nav class="tabs" aria-label="主要功能">
      <button class="tab active" data-page="calendar" type="button">月曆</button>
      <button class="tab" data-page="leave" type="button">登記休假</button>
      <button class="tab" data-page="admin" type="button">員工管理</button>
    </nav>

    <main>
      <section class="page active" id="page-calendar">
        <div class="calendar-toolbar">
          <button class="icon-button" id="prevMonth" type="button" aria-label="上一個月">‹</button>
          <div>
            <h2 id="monthTitle">—</h2>
            <button class="text-button" id="todayButton" type="button">回到本月</button>
          </div>
          <button class="icon-button" id="nextMonth" type="button" aria-label="下一個月">›</button>
        </div>

        <div class="legend" id="employeeLegend" aria-label="員工顏色"></div>
        <div class="calendar-card">
          <div class="weekdays" aria-hidden="true">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div class="calendar-grid" id="calendarGrid" aria-live="polite"></div>
        </div>
        <p class="hint">點選日期可以直接前往登記。</p>
      </section>

      <section class="page" id="page-leave">
        <div class="form-card">
          <div class="section-heading">
            <p class="eyebrow">REGISTER</p>
            <h2>登記休假</h2>
            <p>選擇姓名並輸入自己的員工編號。</p>
          </div>
          <form id="leaveForm">
            <label for="leaveEmployee">姓名</label>
            <select id="leaveEmployee" required></select>
            <label for="employeeCode">員工編號</label>
            <input id="employeeCode" type="password" autocomplete="off" minlength="4" maxlength="32" required>
            <label for="leaveDate">休假日期</label>
            <input id="leaveDate" type="date" required>
            <button class="primary full" type="submit">完成登記</button>
          </form>
        </div>
      </section>

      <section class="page" id="page-admin">
        <div class="admin-grid">
          <div class="form-card">
            <div class="section-heading">
              <p class="eyebrow">ADMIN</p>
              <h2>新增員工</h2>
              <p>員工編號只用於本人登記驗證。</p>
            </div>
            <form id="employeeForm">
              <label for="adminCode">管理密碼</label>
              <input id="adminCode" type="password" autocomplete="current-password" required>
              <label for="employeeName">員工姓名</label>
              <input id="employeeName" type="text" maxlength="30" required>
              <label for="newEmployeeCode">員工編號</label>
              <input id="newEmployeeCode" type="password" minlength="4" maxlength="32" autocomplete="off" required>
              <label for="employeeColor">月曆顏色</label>
              <input id="employeeColor" type="color" value="#2563eb" required>
              <button class="primary full" type="submit">新增員工</button>
            </form>
          </div>

          <div class="form-card secondary-card">
            <div class="section-heading">
              <p class="eyebrow">SECURITY</p>
              <h2>更改管理密碼</h2>
            </div>
            <form id="adminCodeForm">
              <label for="currentAdminCode">目前管理密碼</label>
              <input id="currentAdminCode" type="password" autocomplete="current-password" required>
              <label for="newAdminCode">新管理密碼</label>
              <input id="newAdminCode" type="password" minlength="8" maxlength="64" autocomplete="new-password" required>
              <button class="outline full" type="submit">更新密碼</button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
